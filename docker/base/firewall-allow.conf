# Hosts the base image needs outbound. Lands as
# /etc/claudops/firewall-allow.d/00-base.conf, root-owned -- the agent can read
# it from the console but not append to it.
#
# One entry per line. A name is resolved before the default-deny policy takes
# effect; an address or CIDR is added as it stands; `#` starts a comment.
#
# The Claude Code entries follow its documented network access requirements
# (https://code.claude.com/docs/en/network-config). Four hosts from that table
# are deliberately absent:
#
#   http-intake.logs.us5.datadoghq.com, browser-intake-us5-datadoghq.com
#       Optional operational telemetry. Turned off in the image with
#       CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 instead -- one ENV line beats
#       two whitelist entries.
#   *.frame.claudeusercontent.com
#       Artifact content reads. A wildcard cannot go into an ipset at all, so
#       the image sets CLAUDE_CODE_DISABLE_ARTIFACT=1 rather than pretend.
#   downloads.claude.ai, storage.googleapis.com, formulae.brew.sh
#       Native installer, auto-updater, plugin downloads and Homebrew checks.
#       Claude Code is installed from npm here and DISABLE_AUTOUPDATER=1 is set,
#       so none of them is reached. Add via CLAUDOPS_FIREWALL_ALLOW if a project
#       needs plugins.
#
# GitHub is not listed as a name: its ranges come from
# https://api.github.com/meta at start-up. The three githubusercontent hosts
# below are, because release assets and LFS are not always inside those ranges.

# Claude Code -- required
api.anthropic.com          # API requests, WebFetch domain check, feature flags
platform.claude.com        # OAuth token exchange, refresh and revocation
claude.ai                  # claude.ai account authentication
claude.com                 # sign-in redirect, pre-approved WebFetch lookups
mcp-proxy.anthropic.com    # claude.ai MCP connectors, on by default

# Claude Code -- documentation lookups and the changelog
code.claude.com
raw.githubusercontent.com

# Toolchain
registry.npmjs.org
codeload.github.com
objects.githubusercontent.com

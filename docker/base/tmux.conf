# claudops: tmux-Defaults für die Konsolen-Spiegelung im Browser.

# Grosszügiger Scrollback — er ist der Verlauf, den ein Reconnect wiederfindet.
set -g history-limit 100000

# Farben für das Claude-TUI (xterm.js kann Truecolor).
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm*:Tc"

# Kein Warten auf Escape-Sequenzen, sonst ruckelt die Tastatur über WebSocket.
set -g escape-time 10
set -g focus-events on

# Die Web-UI zeigt nur die Claude-Konsole; die Statuszeile wäre nur Rauschen.
set -g status off

# Fenstergrösse am aktiven Client ausrichten (Resize-Message der Bridge).
setw -g aggressive-resize on

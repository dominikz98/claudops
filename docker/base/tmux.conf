# claudops: tmux defaults for mirroring the console into the browser.

# Generous scrollback -- it is the history a reconnect finds again.
set -g history-limit 100000

# Colors for the Claude TUI (xterm.js can do truecolor).
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm*:Tc"

# Do not wait for escape sequences, otherwise typing stutters over WebSocket.
set -g escape-time 10
set -g focus-events on

# The web UI shows the Claude console only; the status line would be noise.
set -g status off

# Size the window to the active client (resize message from the bridge).
setw -g aggressive-resize on
